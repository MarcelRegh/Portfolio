[build]
  command = "npm run build"
  publish = "dist/portfolio/browser"

[build.environment]
  NODE_VERSION = "22.22.3"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/send_mail/*"
  to = "/.netlify/functions/send-mail"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
