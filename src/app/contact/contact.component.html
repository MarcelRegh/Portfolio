<div id="contact" class="padding-120">
    <header>
        <h1>Contact me.</h1>
        <span>Get in touch via the form below, or by email: <span class="e-mail">metyxs&#64;gmail.com</span></span>
    </header>

    <form (ngSubmit)="onSubmit(contactForm)" #contactForm="ngForm" class="contact-form">
        <div class="form-field">
            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                required
                [class.invalid]="name.invalid && name.touched"
                [(ngModel)]="contact.name"
                name="name"
                #name="ngModel"
                autocomplete="name"
            />
            <span class="error-message" *ngIf="name.invalid && name.touched">Please enter your name.</span>
        </div>

        <div class="form-field">
            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                required
                email
                [class.invalid]="email.invalid && email.touched"
                [(ngModel)]="contact.email"
                name="email"
                #email="ngModel"
                autocomplete="email"
            />
            <span class="error-message" *ngIf="email.touched && email.errors?.['required']">Please enter your email address.</span>
            <span class="error-message" *ngIf="email.touched && email.errors?.['email']">Please enter a valid email address.</span>
        </div>

        <div class="form-field">
            <label for="message">Message</label>
            <textarea
                id="message"
                required
                [class.invalid]="message.invalid && message.touched"
                [(ngModel)]="contact.message"
                name="message"
                #message="ngModel"
                autocomplete="off"
            ></textarea>
            <span class="error-message" *ngIf="message.invalid && message.touched">Please enter your message.</span>
        </div>

        <button mat-button type="submit" [disabled]="!contactForm.form.valid || sendState === 'sending'">
            {{ sendState === 'sending' ? 'Sending...' : 'Submit' }}
        </button>

        <span class="form-status success" *ngIf="sendState === 'success'">Your message has been sent.</span>
        <span class="form-status error" *ngIf="sendState === 'error'">Your message could not be sent. Please try again.</span>
    </form>
</div>
